substitutions:
  board: esp32dev # Your esp32 board

  # Wifi credentials
  wifi_ssid: !secret wifi_ssid # Required to replace
  wifi_password: !secret wifi_password # Required to replace

  # OTA and API
  ota_password: !secret ota_password
  api_password: !secret api_password

esphome:
  name: blekeyboard
  platformio_options: # Delete if you don't want to use NimBLE mode. More details: https://github.com/T-vK/ESP32-BLE-Keyboard#nimble-mode
    build_flags: -D USE_NIMBLE
  includes:
    - inc/BleKeyboard.cpp
    - inc/BleKeyboard.h
    - inc/keymap.h
  libraries:
    - NimBLE-Arduino@^2.5.1

esp32:
  board: $board
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_NIMBLE_ENABLED: "y"
      CONFIG_BT_BLUEDROID_ENABLED: "n"

# Enable logging
logger:

# Enable OTA
ota:
  - platform: esphome
    password: $ota_password

# Enable WiFi
wifi:
  ssid: $wifi_ssid
  password: $wifi_password

# Enable Home Assistant API
api:
  encryption:
    key: "GENERATE-A-UNIQUE-KEY-FOR-YOUR-SETUP-AT-https://esphome.io/components/api.html"
  actions:
    - action: send
      variables:
        message: string
        delay_ms: int
      then:
        - lambda: |-
            id(keyboard).release(message, delay_ms);

external_components:
  - source:
      type: local
      path: external_components
    components: [ble_keyboard]

ble_keyboard:
  id: keyboard
  device_name: blekeyboard
  manufacturer: ESPHome

binary_sensor:
  - platform: ble_keyboard
    ble_keyboard_id: keyboard
    name: "Connected"
    device_class: "connectivity"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: ble_keyboard
    ble_keyboard_id: keyboard
    name: "Delay"
    unit_of_measurement: "ms"
    icon: "mdi:timer-outline"
    accuracy_decimals: 0

button:
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Blekeyboard Restart (Safe Mode)"
